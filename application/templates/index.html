{% extends "base.html" %}

{%block title%}Index Page{%endblock%}

{%block content%}
<h1 class="text-center">Välj område för prognos nedan</h1>

<form class="text-center" action="/weather" method="GET">
    <select name="city" class="form-select w-50 mx-auto">
        <option class="text-center" value="Stockholm">Stockholm</option>
        <option class="text-center" value="Göteborg">Göteborg</option>
        <option class="text-center" value="Malmö">Malmö</option>
        <option class="text-center" value="Umeå">Umeå</option>
        <option class="text-center" value="Kiruna">Kiruna</option>
    </select>

    <button type="submit" class="btn btn-primary mt-3">
        Visa väder
    </button>
</form>
{%endblock%}
